<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1e1b4b 0%,#312e81 45%,#4c1d95 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;padding:24px}
  .card{text-align:center;max-width:520px}
  h1{font-size:clamp(40px,9vw,76px);font-weight:800;letter-spacing:-2px;
    background:linear-gradient(90deg,#fbbf24,#f472b6 55%,#60a5fa);
    -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  p{margin-top:22px;font-size:16px;color:#c7d2fe;line-height:1.8}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;
    margin-right:8px;animation:p 2s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  .tag{display:inline-block;margin-top:30px;padding:8px 18px;border:1px solid rgba(255,255,255,.25);
    border-radius:999px;font-size:13px;color:#e0e7ff;letter-spacing:.5px;backdrop-filter:blur(6px)}
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p><span class="dot"></span>这个页面已经跑起来了</p>
    <div class="tag">GitHub Pages · 静态托管</div>
  </div>
</body>
</html>
